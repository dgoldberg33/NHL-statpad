<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL StatPad</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #fff; font-family: system-ui, sans-serif; }
@keyframes spin { to { transform: rotate(360deg); } }
.app { max-width: 540px; margin: 0 auto; padding: 12px; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.logo { font-size: 18px; font-weight: 700; letter-spacing: -.5px; }
.pill { background: #222; color: #aaa; border: 1px solid #333; border-radius: 20px; padding: 5px 13px; font-size: 12px; font-weight: 600; }
.pill.active { background: #1e3a5f; border-color: #60a5fa; color: #fff; }
.hdr { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; margin-bottom: 12px; }
.hdr-big { font-size: 26px; font-weight: 800; line-height: 1; }
.hdr-cat { font-size: 18px; letter-spacing: 2px; }
.hdr-lbl { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: .7px; margin-top: 3px; }
.hdr-sub { font-size: 9px; color: #444; margin-top: 1px; }
.rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 90px 72px 1fr 102px; background: #1e1e1e; border-radius: 7px; overflow: hidden; min-height: 80px; }
.cell { display: flex; align-items: center; justify-content: center; padding: 8px 6px; border-right: 1px solid #252525; }
.cell:last-child { border-right: none; }
.team-cell { background: #191919; flex-direction: column; }
.logos { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 82px; }
.logo-dot { width: 27px; height: 27px; border-radius: 50%; font-size: 7.5px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.year-cell { flex-direction: column; text-align: center; }
.yr { font-size: 13px; font-weight: 700; color: #ddd; line-height: 1.3; }
.extra-cell { flex-direction: column; text-align: center; gap: 2px; padding: 6px 4px; }
.ex-type { font-size: 8px; color: #555; text-transform: uppercase; letter-spacing: .5px; }
.ex-val { font-size: 11px; font-weight: 700; color: #ccc; line-height: 1.3; }
.ex-scope { font-size: 8px; color: #444; background: #252525; border-radius: 3px; padding: 2px 5px; margin-top: 2px; }
.add-cell { background: #16a34a; cursor: pointer; flex-direction: column; gap: 3px; }
.add-cell:hover { background: #15803d; }
.add-cell.locked { background: #1d4ed8; cursor: pointer; }
.add-plus { font-size: 22px; font-weight: 200; line-height: 1; }
.add-txt { font-size: 9px; font-weight: 700; letter-spacing: .3px; }
.add-name { font-size: 10px; font-weight: 700; text-align: center; padding: 0 4px; line-height: 1.3; word-break: break-word; }
.add-score { font-size: 15px; font-weight: 800; }
.bbtns { display: flex; justify-content: center; gap: 16px; margin-top: 8px; }
.bbtn { background: #1e1e1e; border: 1px solid #333; border-radius: 22px; padding: 9px 16px; font-size: 11px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; }
.bbtn:hover { background: #252525; color: #ccc; }
.bbtn.hl { border-color: #60a5fa; color: #60a5fa; }
.bbtn .ico { font-size: 15px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
.modal { background: #1c1c1c; border-radius: 14px 14px 0 0; padding: 18px 14px 26px; width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; }
.modal-title { font-size: 11px; color: #555; text-align: center; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
.modal-info { background: #242424; border-radius: 7px; padding: 9px 12px; margin-bottom: 10px; font-size: 12px; color: #888; line-height: 1.7; }
.modal-info strong { color: #ccc; }
.modal-err { background: #3b1515; border: 1px solid #7f1d1d; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; color: #fca5a5; line-height: 1.5; display: none; }
.modal-err.show { display: block; }
.modal-locked { background: #1a2e4a; border-radius: 7px; padding: 9px 12px; margin-bottom: 10px; font-size: 13px; color: #93c5fd; }
.search-input { width: 100%; background: #242424; border: 1px solid #333; border-radius: 7px; padding: 11px 13px; font-size: 15px; color: #fff; margin-bottom: 7px; outline: none; box-sizing: border-box; }
.search-input:focus { border-color: #3b82f6; }
.results-list { display: flex; flex-direction: column; gap: 1px; max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
.result-item { background: #242424; padding: 10px 13px; font-size: 13px; color: #ddd; cursor: pointer; border-radius: 6px; }
.result-item:hover, .result-item.selected { background: #2e2e2e; color: #fff; }
.result-empty { padding: 12px; color: #444; font-size: 12px; text-align: center; }
.submit-btn { width: 100%; background: #16a34a; border: none; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; margin-bottom: 7px; }
.submit-btn:disabled { background: #252525; color: #444; cursor: default; }
.close-btn { width: 100%; background: #242424; border: none; border-radius: 9px; padding: 11px; font-size: 13px; color: #666; cursor: pointer; margin-top: 4px; }
.close-btn:hover { color: #aaa; }
.results-modal { background: #1c1c1c; border-radius: 14px 14px 0 0; padding: 18px 14px 30px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
.res-row-hdr { font-size: 11px; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: center; }
.lb-table { width: 100%; border-collapse: collapse; }
.lb-table tr { border-bottom: 1px solid #252525; }
.lb-table tr:last-child { border-bottom: none; }
.lb-table td { padding: 7px 6px; font-size: 12px; color: #999; vertical-align: middle; }
.lb-table td:first-child { width: 28px; color: #555; font-size: 11px; font-weight: 700; text-align: center; }
.lb-table td:last-child { text-align: right; font-weight: 700; color: #ddd; font-size: 13px; }
.lb-table tr.mine td { background: #1a2e4a; }
.lb-table tr.mine td:first-child { color: #60a5fa; }
.lb-table tr.mine td:last-child { color: #4ade80; }
.lb-name { font-size: 12px; color: #ccc; }
.lb-yr { font-size: 10px; color: #555; margin-top: 1px; }
.pct-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: middle; }
.pct-great { background: #14532d; color: #4ade80; }
.pct-good  { background: #1e3a5f; color: #93c5fd; }
.pct-ok    { background: #422006; color: #fb923c; }
.pct-low   { background: #3b1515; color: #f87171; }
.sep { height: 1px; background: #252525; margin: 14px 0; }
.overall-bar { background: #242424; border-radius: 8px; padding: 12px 14px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
.how-modal { background: #1c1c1c; border-radius: 14px 14px 0 0; padding: 22px 16px 30px; width: 100%; max-width: 540px; }
.how-modal h2 { color: #fff; font-size: 16px; margin-bottom: 14px; text-align: center; font-weight: 700; }
.how-modal p { color: #888; font-size: 13px; margin-bottom: 9px; line-height: 1.7; }
.how-modal strong { color: #ccc; }
.center { max-width: 540px; margin: 0 auto; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite; }
.load-msg { color: #aaa; font-size: 14px; text-align: center; }
.done-banner { background: #1a2e4a; border: 1px solid #1e3a5f; border-radius: 8px; padding: 14px 16px; text-align: center; margin-bottom: 12px; }
.done-title { font-size: 13px; color: #60a5fa; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
.done-nums { display: flex; justify-content: center; gap: 32px; }
.done-stat { display: flex; flex-direction: column; align-items: center; }
.done-big { font-size: 28px; font-weight: 800; }
.done-lbl { font-size: 9px; color: #555; margin-top: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="app"></div>
<script>

// ─── Team colours ──────────────────────────────────────────────────────────────
const TC = {EDM:"#FF4C00",TOR:"#003E7E",MTL:"#AF1E2D",BOS:"#FFB81C",PIT:"#FCB514",WSH:"#C8102E",COL:"#6F263D",TB:"#002868",DET:"#CE1126",NYR:"#0038A8",CAR:"#CC0000",STL:"#002F87",CGY:"#C8102E",VAN:"#00843D",CHI:"#CF0A2C",DAL:"#006847",MIN:"#154734",PHI:"#F74902",NJ:"#CE1126",BUF:"#003087",NYI:"#003087",OTT:"#E4173E",WPG:"#041E42",NSH:"#FFB81C",FLA:"#041E42",ANA:"#F47A38",LA:"#A2AAAD",SJ:"#006D75",SEA:"#001628",VGK:"#B4975A",UTA:"#6F263D",CBJ:"#002654",PHO:"#8C2633",QUE:"#003DA5",HFD:"#006400",ATL:"#4B3F72",MNS:"#154734",HAR:"#006400"};

function normTeam(t) { const m={NJD:"NJ",LAK:"LA",SJS:"SJ",TBL:"TB",PHX:"PHO"}; return (m[t]||t||"").trim(); }
function parseTeams(s) { return (s||"").split(",").map(x=>normTeam(x.trim())).filter(Boolean); }

// ─── Categories ────────────────────────────────────────────────────────────────
const CATS = [
  {id:"pts",lbl:"PTS",sub:"(SKATERS)",isG:false,score:p=>p.pts,fmt:v=>v+""},
  {id:"g",  lbl:"G",  sub:"(GOALS)",  isG:false,score:p=>p.g,  fmt:v=>v+""},
  {id:"a",  lbl:"A",  sub:"(ASSISTS)",isG:false,score:p=>p.a,  fmt:v=>v+""},
  {id:"pim",lbl:"PIM",sub:"(PENALTY MIN)",isG:false,score:p=>p.pim,fmt:v=>v+""},
  {id:"ppg",lbl:"PPG",sub:"(POWER PLAY G)",isG:false,score:p=>p.ppg,fmt:v=>v+""},
  {id:"sog",lbl:"SOG",sub:"(SHOTS ON GOAL)",isG:false,score:p=>p.sog,fmt:v=>v+""},
  {id:"w",  lbl:"W",  sub:"(GOALIE WINS)",isG:true,score:p=>p.w,fmt:v=>v+""},
  {id:"sv", lbl:"SV%",sub:"(SAVE PCT)",isG:true,score:p=>p.sv,fmt:v=>"."+Math.round(v*1000)},
  {id:"gaa",lbl:"GAA",sub:"(GOALS AGAINST AVG)",isG:true,score:p=>-p.gaa,fmt:v=>v.toFixed(2)},
  {id:"so", lbl:"SO", sub:"(SHUTOUTS)",isG:true,score:p=>p.so,fmt:v=>v+""},
];

// ─── Puzzles ───────────────────────────────────────────────────────────────────
const PUZZLES = [
  {catId:"pts",rows:[
    {tm:["EDM"],f:2015,t:2026,ex:null},
    {tm:["MTL"],f:1970,t:1995,ex:{type:"NATIONALITY",val:"CAN",label:"Canadian"}},
    {tm:["NYI"],f:1975,t:1990,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
    {tm:["DET"],f:1983,t:2010,ex:null},
    {tm:["TB"], f:2008,t:2026,ex:{type:"NATIONALITY",val:"RUS",label:"Russian"}},
  ]},
  {catId:"g",rows:[
    {tm:["TOR"],f:2016,t:2026,ex:null},
    {tm:["STL"],f:1986,t:2004,ex:null},
    {tm:["NYI"],f:1975,t:1990,ex:null},
    {tm:["WSH"],f:2005,t:2026,ex:null},
    {tm:["ANA","WPG"],f:1992,t:2026,ex:null},
  ]},
  {catId:"pim",rows:[
    {tm:["EDM"],f:1979,t:2004,ex:null},
    {tm:["DET"],f:1987,t:2009,ex:null},
    {tm:["CHI"],f:1984,t:2010,ex:null},
    {tm:["OTT"],f:2018,t:2026,ex:null},
    {tm:["BOS"],f:1979,t:2005,ex:null},
  ]},
  {catId:"a",rows:[
    {tm:["EDM","LA"],f:1979,t:1999,ex:null},
    {tm:["PIT"],f:1984,t:2026,ex:null},
    {tm:["SJ"], f:2005,t:2015,ex:null},
    {tm:["DET"],f:2001,t:2020,ex:{type:"NATIONALITY",val:"SWE",label:"Swedish"}},
    {tm:["COL"],f:2013,t:2026,ex:null},
  ]},
  {catId:"ppg",rows:[
    {tm:["BUF","TOR"],f:1982,t:2010,ex:null},
    {tm:["WSH"],f:2005,t:2026,ex:{type:"POSITION",val:"LW",label:"Left Wing"}},
    {tm:["PIT"],f:1984,t:2010,ex:null},
    {tm:["STL"],f:1986,t:2004,ex:null},
    {tm:["LA"], f:1986,t:2008,ex:null},
  ]},
  {catId:"w",rows:[
    {tm:["NJ"], f:1991,t:2015,ex:{type:"NATIONALITY",val:"CAN",label:"Canadian"}},
    {tm:["NYR"],f:2005,t:2026,ex:null},
    {tm:["WSH"],f:2010,t:2026,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
    {tm:["MTL"],f:1970,t:1999,ex:null},
    {tm:["PIT"],f:2003,t:2026,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
  ]},
  {catId:"sv",rows:[
    {tm:["BUF"],f:1990,t:2010,ex:null},
    {tm:["MTL"],f:1984,t:2023,ex:{type:"NATIONALITY",val:"CAN",label:"Canadian"}},
    {tm:["BOS"],f:2007,t:2021,ex:null},
    {tm:["COL"],f:1994,t:2010,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
    {tm:["NYR"],f:2019,t:2026,ex:null},
  ]},
  {catId:"sog",rows:[
    {tm:["WSH"],f:2005,t:2026,ex:{type:"POSITION",val:"LW",label:"Left Wing"}},
    {tm:["EDM"],f:1979,t:1988,ex:null},
    {tm:["BOS","CHI"],f:1963,t:1981,ex:null},
    {tm:["COL"],f:2013,t:2026,ex:null},
    {tm:["CGY"],f:1996,t:2017,ex:null},
  ]},
  {catId:"g",rows:[
    {tm:["PHI","BOS"],f:1967,t:1985,ex:null},
    {tm:["CGY","EDM"],f:1979,t:2000,ex:null},
    {tm:["DET"],f:1985,t:2010,ex:null},
    {tm:["COL","NJ"],f:1994,t:2010,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
    {tm:["FLA","TB"],f:2010,t:2026,ex:null},
  ]},
  {catId:"pts",rows:[
    {tm:["NYR","NYI"],f:1972,t:1995,ex:null},
    {tm:["EDM"],f:1979,t:1999,ex:null},
    {tm:["BOS"],f:1965,t:1985,ex:null},
    {tm:["PIT"],f:1984,t:2010,ex:{type:"WON_CUP",label:"Won Stanley Cup"}},
    {tm:["COL","DAL"],f:1993,t:2015,ex:null},
  ]},
];

// ─── Cup winners ───────────────────────────────────────────────────────────────
const CUPS = {2024:"FLA",2023:"VGK",2022:"COL",2021:"TB",2020:"TB",2019:"STL",2018:"WSH",2017:"PIT",2016:"PIT",2015:"CHI",2014:"LA",2013:"CHI",2012:"LA",2011:"BOS",2010:"CHI",2009:"PIT",2008:"DET",2007:"ANA",2006:"CAR",2004:"TB",2003:"NJ",2002:"DET",2001:"COL",2000:"NJ",1999:"DAL",1998:"DET",1997:"DET",1996:"COL",1995:"NJ",1994:"NYR",1993:"MTL",1992:"PIT",1991:"PIT",1990:"EDM",1989:"CGY",1988:"EDM",1987:"EDM",1986:"MTL",1985:"EDM",1984:"EDM",1983:"NYI",1982:"NYI",1981:"NYI",1980:"NYI",1979:"MTL",1978:"MTL",1977:"MTL",1976:"MTL",1975:"PHI",1974:"PHI",1973:"MTL",1972:"BOS",1971:"MTL",1970:"BOS"};

function playerWonCup(p) {
  for (const [yr,winner] of Object.entries(CUPS)) {
    const y=parseInt(yr);
    if (y>=p.f && y<=p.t && p.tm.includes(normTeam(winner))) return true;
  }
  return false;
}

function checkConstraint(p,ex) {
  if (!ex) return {ok:true};
  if (ex.type==="POSITION") {
    const pos=(p.pos||"").toUpperCase(), want=(ex.val||"").toUpperCase();
    const ok=pos===want||(want==="LW"&&(pos==="L"||pos==="LW"))||(want==="RW"&&(pos==="R"||pos==="RW"));
    if (!ok) return {ok:false,msg:`${p.n} plays ${p.pos}, not ${ex.label}`};
  }
  if (ex.type==="WON_CUP" && !playerWonCup(p))
    return {ok:false,msg:`${p.n} has never won the Stanley Cup`};
  if (ex.type==="NATIONALITY" && p.nat!==ex.val)
    return {ok:false,msg:`${p.n} is not ${ex.label}`};
  return {ok:true};
}

function fitsRow(p,row) {
  if (!row.tm.some(t=>p.tm.includes(t)))
    return {ok:false,msg:`${p.n} never played for ${row.tm.join(" / ")}`};
  if (p.t<row.f || p.f>row.t)
    return {ok:false,msg:`${p.n} wasn't active during ${row.f}–${row.t}`};
  return checkConstraint(p,row.ex);
}

// ─── Cache ─────────────────────────────────────────────────────────────────────
const CK="nhl_statpad_v5",CH=24;
function getCached(){try{const r=localStorage.getItem(CK);if(!r)return null;const{ts,data}=JSON.parse(r);if(Date.now()-ts<CH*3600000)return data;}catch(e){}return null;}
function setCache(d){try{localStorage.setItem(CK,JSON.stringify({ts:Date.now(),data:d}));}catch(e){}}

// ─── NHL API fetch ──────────────────────────────────────────────────────────────
async function fetchPage(url) {
  // Use our own Vercel proxy — no CORS issues, no rate limits
  const proxyUrl = "/api/nhl?" + new URLSearchParams({
    path: url.replace("https://api.nhle.com/stats/rest/en", ""),
  }).toString();
  const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
  if (!r.ok) throw new Error("NHL API returned " + r.status);
  return r.json();
}

async function fetchAll(isGoalie,onProg) {
  const basePath = isGoalie
    ? "/goalie/summary"
    : "/skater/summary";
  const baseParams = isGoalie
    ? "sort=wins&direction=DESC&cayenneExp=gameTypeId=2"
    : "sort=points&direction=DESC&cayenneExp=gameTypeId=2";
  const byId={};
  let start=0;
  while(true){
    const fullUrl = "https://api.nhle.com/stats/rest/en" + basePath + "?" + baseParams + "&limit=100&start=" + start;
    const data=await fetchPage(fullUrl);
    const rows=data.data||[];
    if(!rows.length) break;
    for(const r of rows){
      const id=r.playerId; if(!id) continue;
      const n=isGoalie?(r.goalieFullName||""):(r.skaterFullName||"");
      const tm=parseTeams(r.teamAbbrevs);
      const yr=r.seasonId?parseInt(String(r.seasonId).slice(0,4)):1970;
      const pos=isGoalie?"G":(r.positionCode||"C");
      const nat=r.nationalityCode||"";
      const pts=r.points||0,g=r.goals||0,a=r.assists||0,pim=r.penaltyMinutes||0,ppg=r.powerPlayGoals||0,sog=r.shots||0;
      const w=r.wins||0,sv=r.savePctg??r.savePct??0,gaa=r.goalsAgainstAverage||0,so=r.shutouts||0;
      if(!byId[id]){byId[id]={id,n,tm:[...tm],f:yr,t:yr+1,pos,nat,pts,g,a,pim,ppg,sog,w,sv,gaa,so};}
      else{
        const p=byId[id];
        tm.forEach(t=>{if(t&&!p.tm.includes(t))p.tm.push(t);});
        p.f=Math.min(p.f,yr); p.t=Math.max(p.t,yr+1);
        p.pts=Math.max(p.pts,pts); p.g=Math.max(p.g,g); p.a=Math.max(p.a,a);
        p.pim=Math.max(p.pim,pim); p.ppg=Math.max(p.ppg,ppg); p.sog=Math.max(p.sog,sog);
        p.w=Math.max(p.w,w); p.sv=Math.max(p.sv,sv); p.so=Math.max(p.so,so);
        if(gaa>0) p.gaa=p.gaa===0?gaa:Math.min(p.gaa,gaa);
      }
    }
    onProg(Object.keys(byId).length);
    if(rows.length<100) break;
    start+=100;
  }
  return Object.values(byId);
}

// ─── App state ─────────────────────────────────────────────────────────────────
const todayIdx = new Date().getDate() % PUZZLES.length;
const puzzle   = PUZZLES[todayIdx];
const cat      = CATS.find(c=>c.id===puzzle.catId);

let players=[], answers=Array(5).fill(null), totalGuesses=0;
let modal=null, errMsg="", selPlayer=null, search="";
let isLoading=true, loadMsg="Loading…", loadError=null;

function getScore(p){return cat.score(p);}
function rawScore(p){return Math.abs(cat.score(p));}
function dispScore(p){
  if(cat.id==="sv") return cat.fmt(p.sv);
  if(cat.id==="gaa") return cat.fmt(p.gaa);
  return cat.fmt(getScore(p));
}
function avgScore(){
  const f=answers.filter(Boolean);
  if(!f.length) return cat.id==="sv"?".000":cat.id==="gaa"?"0.00":"0";
  const avg=f.reduce((s,a)=>s+a.raw,0)/f.length;
  if(cat.id==="sv") return "."+Math.round(avg*1000);
  if(cat.id==="gaa") return avg.toFixed(2);
  return Math.round(avg)+"";
}
function getLB(ri){return players.filter(p=>fitsRow(p,puzzle.rows[ri]).ok).sort((a,b)=>getScore(b)-getScore(a));}
function searchPlayers(q){if(!q)return[];const lq=q.toLowerCase();return players.filter(p=>p.n.toLowerCase().includes(lq)).slice(0,20);}

// ─── Render ────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (!app) return;

  if (isLoading) {
    app.innerHTML = `<div class="center">
      <div class="spinner"></div>
      <div class="load-msg" id="load-msg">${loadMsg}</div>
      <div style="color:#555;font-size:11px;text-align:center;max-width:280px;line-height:1.6">
        First load fetches every NHL player — cached 24h after
      </div>
    </div>`;
    return;
  }

  if (loadError) {
    app.innerHTML = `<div class="center">
      <div class="load-msg" style="color:#f87171">${loadError}</div>
      <button onclick="startLoad()" style="background:#16a34a;border:none;border-radius:9px;padding:10px 24px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;margin-top:8px">Retry</button>
    </div>`;
    return;
  }

  const done = answers.every(Boolean);
  let html = `<div class="app">`;

  html += `<div class="topbar">
    <div class="logo">StatpadGame.com</div>
    <div style="display:flex;gap:6px">
      <div class="pill active">Today</div>
      <div class="pill">NHL</div>
    </div>
  </div>`;

  html += `<div style="text-align:center;font-size:10px;color:#333;margin-bottom:8px">${players.length.toLocaleString()} players</div>`;

  if (done) {
    html += `<div class="done-banner">
      <div class="done-title">Puzzle Complete</div>
      <div class="done-nums">
        <div class="done-stat"><div class="done-big">${avgScore()}</div><div class="done-lbl">Avg ${cat.lbl}</div></div>
        <div class="done-stat"><div class="done-big">${totalGuesses}</div><div class="done-lbl">Total Guesses</div></div>
      </div>
    </div>`;
  }

  html += `<div class="hdr">
    <div><div class="hdr-big hdr-cat">${cat.lbl}</div><div class="hdr-lbl">CATEGORY</div><div class="hdr-sub">${cat.sub}</div></div>
    <div><div class="hdr-big">${avgScore()}</div><div class="hdr-lbl">AVERAGE SCORE</div></div>
    <div><div class="hdr-big">${totalGuesses}</div><div class="hdr-lbl">TOTAL GUESSES</div></div>
  </div>`;

  html += `<div class="rows">`;
  puzzle.rows.forEach((row,ri) => {
    const ans = answers[ri];
    const dtm = [...new Set(row.tm.map(normTeam))];
    const yrLines = row.f===row.t ? [row.f] : [row.f,"to",row.t];
    html += `<div class="row">
      <div class="cell team-cell"><div class="logos">
        ${dtm.map(t=>`<div class="logo-dot" style="background:${TC[t]||"#444"}">${t}</div>`).join("")}
      </div></div>
      <div class="cell year-cell">${yrLines.map(l=>`<div class="yr">${l}</div>`).join("")}</div>
      <div class="cell extra-cell">${row.ex?`<div class="ex-type">${row.ex.type.replace("_"," ")}</div><div class="ex-val">${row.ex.label}</div><div class="ex-scope">CAREER</div>`:""}</div>
      ${ans
        ? `<div class="cell add-cell locked" onclick="openRow(${ri})"><div class="add-name">${ans.name}</div><div class="add-score">${ans.display}</div></div>`
        : `<div class="cell add-cell" onclick="openRow(${ri})"><div class="add-plus">+</div><div class="add-txt">add player</div></div>`
      }
    </div>`;
  });
  html += `</div>`;

  html += `<div class="bbtns">
    ${done?`<button class="bbtn hl" onclick="openResults()"><div class="ico">★</div>RESULTS</button>`:""}
    <button class="bbtn" onclick="openHow()"><div class="ico">?</div>HOW TO PLAY</button>
  </div>`;

  // Modal
  if (modal) html += buildModal();

  html += `</div>`;
  app.innerHTML = html;

  // Focus search input after render
  const inp = document.getElementById("search-input");
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}

function buildModal() {
  if (modal.type==="how") return `<div class="overlay" onclick="closeModal()">
    <div class="how-modal" onclick="event.stopPropagation()">
      <h2>How to Play</h2>
      <p><strong>Category:</strong> Find the player with the best single-season value for today's stat.</p>
      <p><strong>Each row:</strong> Shows team(s), a year range, and sometimes an extra constraint. Player must fit all three.</p>
      <p><strong>Guessing:</strong> Type a name, pick, submit. Wrong picks show why — row stays open.</p>
      <p><strong>Every guess counts:</strong> Adds to Total Guesses even if wrong. Fewer is better.</p>
      <p><strong>Locked forever:</strong> Once locked it can't be changed.</p>
      <p><strong>Results:</strong> After all 5 rows, see top answers and your percentile.</p>
      <button class="close-btn" onclick="closeModal()">Got it</button>
    </div>
  </div>`;

  if (modal.type==="results") return buildResultsModal();

  // Row modal
  const ri=modal.ri, row=puzzle.rows[ri], ans=answers[ri];
  const dtm=[...new Set(row.tm.map(normTeam))];
  const yr=row.f===row.t?row.f:`${row.f}–${row.t}`;
  const sr=searchPlayers(search);

  return `<div class="overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Row ${ri+1} — ${cat.lbl}${ans?" · locked":""}</div>
      <div class="modal-info">
        <strong>Team${dtm.length>1?"s":""}:</strong> ${dtm.join(", ")} &nbsp;·&nbsp;
        <strong>Years:</strong> ${yr}
        ${row.ex?`<br><strong>${row.ex.type.replace("_"," ")}:</strong> ${row.ex.label}`:""}
      </div>
      ${ans
        ? `<div class="modal-locked">Locked: <strong>${ans.name}</strong> — ${ans.display} ${cat.lbl}</div>
           <button class="close-btn" onclick="closeModal()">Close</button>`
        : `<div class="modal-err${errMsg?" show":""}" id="modal-err">${errMsg}</div>
           <input class="search-input" id="search-input" type="text"
             placeholder="Search player name…"
             value="${search.replace(/"/g,'&quot;')}"
             oninput="onSearch(this.value,${ri})"
             autocomplete="off">
           <div class="results-list" id="results-list">
             ${!search
               ? `<div class="result-empty">Start typing a player name…</div>`
               : !sr.length
                 ? `<div class="result-empty">No players found</div>`
                 : sr.map((p,i)=>`<div class="result-item${selPlayer&&selPlayer.n===p.n?" selected":""}" onmousedown="pickPlayer(${i})">${p.n}</div>`).join("")
             }
           </div>
           <button class="submit-btn" id="submit-btn" ${!selPlayer?"disabled":""} onclick="submitAnswer(${ri})">Submit</button>
           <button class="close-btn" onclick="closeModal()">Cancel</button>`
      }
    </div>
  </div>`;
}

function buildResultsModal() {
  const allPcts=[];
  const rows=puzzle.rows.map((row,ri)=>{
    const lb=getLB(ri),ans=answers[ri];
    const myRank=ans?lb.findIndex(p=>p.n===ans.name):-1;
    const pct=myRank>=0?Math.round((1-myRank/lb.length)*100):null;
    if(pct!==null)allPcts.push(pct);
    return{row,ri,lb,ans,myRank,pct,top:lb.slice(0,8),myInTop:myRank>=0&&myRank<8};
  });
  const avgPct=allPcts.length?Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length):0;

  let h=`<div class="overlay" onclick="closeModal()"><div class="results-modal" onclick="event.stopPropagation()">
    <div style="font-size:11px;color:#555;text-align:center;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">Results — ${cat.lbl}</div>`;

  rows.forEach(({row,ri,lb,ans,myRank,pct,top,myInTop})=>{
    const yr=row.f===row.t?row.f:`${row.f}–${row.t}`;
    const dtm=[...new Set(row.tm.map(normTeam))];
    h+=`<div class="res-row-hdr"><span>Row ${ri+1}: ${dtm.join("/")} · ${yr}</span><span style="color:#444;font-weight:400;font-size:10px">${lb.length} valid</span></div>`;
    if(row.ex)h+=`<div style="font-size:10px;color:#444;margin-bottom:6px">${row.ex.label}</div>`;
    h+=`<table class="lb-table"><tbody>`;
    top.forEach((p,i)=>{
      const mine=ans&&p.n===ans.name;
      h+=`<tr class="${mine?"mine":""}"><td>#${i+1}</td><td><div class="lb-name">${p.n}</div><div class="lb-yr">${p.f}–${p.t}</div></td><td>${dispScore(p)}</td></tr>`;
    });
    if(ans&&!myInTop&&myRank>=0)h+=`<tr><td colspan="3" style="color:#333;font-size:10px;text-align:center;padding:3px">· · ·</td></tr><tr class="mine"><td>#${myRank+1}</td><td><div class="lb-name">${ans.name}</div><div class="lb-yr">your pick</div></td><td>${ans.display}</td></tr>`;
    if(!ans)h+=`<tr><td colspan="3" style="padding:6px;color:#333;font-size:11px">No answer</td></tr>`;
    h+=`</tbody></table>`;
    if(pct!==null){const c=pct>=90?"pct-great":pct>=70?"pct-good":pct>=40?"pct-ok":"pct-low";h+=`<div style="text-align:right;margin-top:5px;font-size:11px;color:#555"><strong style="color:#ccc">${ans.name}</strong> — ${ans.display} ${cat.lbl} <span class="pct-pill ${c}">${Math.round(pct)}th pct</span></div>`;}
    if(ri<4)h+=`<div class="sep"></div>`;
  });

  const c=avgPct>=90?"pct-great":avgPct>=70?"pct-good":avgPct>=40?"pct-ok":"pct-low";
  h+=`<div class="overall-bar"><div style="font-size:11px;color:#555;text-transform:uppercase">Overall percentile</div><div style="display:flex;align-items:center;gap:8px"><span class="pct-pill ${c}">${avgPct}th pct</span><span style="font-size:20px;font-weight:800;color:#fff">${avgPct}th</span></div></div>
  <button class="close-btn" onclick="closeModal()">Close</button>
  </div></div>`;
  return h;
}

// ─── Event handlers ────────────────────────────────────────────────────────────
function onSearch(val, ri) {
  search=val; selPlayer=null; errMsg="";
  const err=document.getElementById("modal-err");
  const list=document.getElementById("results-list");
  const btn=document.getElementById("submit-btn");
  if(err){err.textContent="";err.classList.remove("show");}
  if(btn) btn.disabled=true;
  if(list){
    const sr=searchPlayers(val);
    if(!val){list.innerHTML=`<div class="result-empty">Start typing a player name…</div>`;}
    else if(!sr.length){list.innerHTML=`<div class="result-empty">No players found</div>`;}
    else{list.innerHTML=sr.map((p,i)=>`<div class="result-item${selPlayer&&selPlayer.n===p.n?" selected":""}" onmousedown="pickPlayer(${i})">${p.n}</div>`).join("");}
  }
}

function pickPlayer(i) {
  const sr=searchPlayers(search);
  selPlayer=sr[i]||null; errMsg="";
  document.querySelectorAll(".result-item").forEach((el,idx)=>el.classList.toggle("selected",idx===i));
  const btn=document.getElementById("submit-btn");
  if(btn) btn.disabled=!selPlayer;
}

function submitAnswer(ri) {
  if(!selPlayer) return;
  totalGuesses++;
  const check=fitsRow(selPlayer,puzzle.rows[ri]);
  if(!check.ok){
    errMsg=check.msg;
    const err=document.getElementById("modal-err");
    if(err){err.textContent=errMsg;err.classList.add("show");}
    return;
  }
  answers[ri]={name:selPlayer.n,display:dispScore(selPlayer),raw:rawScore(selPlayer)};
  modal=null; search=""; selPlayer=null; errMsg="";
  render();
}

function openRow(ri){modal={type:"row",ri};search="";selPlayer=null;errMsg="";render();}
function openHow(){modal={type:"how"};render();}
function openResults(){modal={type:"results"};render();}
function closeModal(){modal=null;search="";selPlayer=null;errMsg="";render();}
function startLoad(){loadPlayers();}

// ─── Load players ──────────────────────────────────────────────────────────────
async function loadPlayers() {
  isLoading=true; loadError=null; loadMsg="Checking cache…";
  render();

  const cached=getCached();
  if(cached&&cached.length>200){
    players=cached; isLoading=false; render(); return;
  }

  try {
    loadMsg="Fetching all NHL skaters…"; render();
    const skaters=await fetchAll(false,n=>{
      loadMsg=`Fetching skaters… ${n.toLocaleString()}`;
      const el=document.getElementById("load-msg");
      if(el) el.textContent=loadMsg;
    });
    loadMsg="Fetching all NHL goalies…";
    const el=document.getElementById("load-msg");
    if(el) el.textContent=loadMsg;
    const goalies=await fetchAll(true,n=>{
      loadMsg=`Fetching goalies… ${n.toLocaleString()}`;
      const el2=document.getElementById("load-msg");
      if(el2) el2.textContent=loadMsg;
    });
    players=[...skaters,...goalies];
    setCache(players);
    isLoading=false; render();
  } catch(e) {
    loadError="Failed to load NHL data: "+e.message;
    isLoading=false; render();
  }
}

// Boot
loadPlayers();
</script>
</body>
</html>
